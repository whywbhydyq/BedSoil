<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Raised bed soil volume planning diagram</title>
  <desc id="desc">A labeled raised bed diagram showing length, width, fill depth, freeboard, bag count, bulk soil, compost mix, and shopping list outputs.</desc>
  <rect width="960" height="540" rx="32" fill="#f7f2e8"/>
  <rect x="58" y="58" width="844" height="424" rx="28" fill="#fffaf2" stroke="#d8c9b4" stroke-width="3"/>
  <path d="M210 318 L560 230 L756 303 L395 405 Z" fill="#8f5f32" stroke="#5b3d25" stroke-width="5"/>
  <path d="M210 252 L560 164 L756 237 L395 339 Z" fill="#d49a56" stroke="#5b3d25" stroke-width="5"/>
  <path d="M210 252 L210 318 L395 405 L395 339 Z" fill="#7a5130" stroke="#5b3d25" stroke-width="5"/>
  <path d="M395 339 L395 405 L756 303 L756 237 Z" fill="#6b472b" stroke="#5b3d25" stroke-width="5"/>
  <path d="M230 254 L560 174 L735 238 L397 333 Z" fill="#3f7f4b" opacity="0.85"/>
  <path d="M246 260 C345 236 420 214 525 188" stroke="#f5d88f" stroke-width="8" fill="none" opacity="0.75"/>
  <path d="M320 286 C405 260 493 239 640 208" stroke="#f5d88f" stroke-width="8" fill="none" opacity="0.55"/>
  <g fill="#2d3a25" font-family="Arial, Helvetica, sans-serif">
    <text x="82" y="105" font-size="34" font-weight="700">BedSoil planning model</text>
    <text x="82" y="140" font-size="18">Dimensions → volume → bags, bulk order, mix, and shopping list</text>
    <text x="176" y="411" font-size="22" font-weight="700">length</text>
    <text x="608" y="378" font-size="22" font-weight="700">width</text>
    <text x="772" y="270" font-size="22" font-weight="700">depth</text>
    <text x="134" y="244" font-size="18">freeboard</text>
  </g>
  <g stroke="#2d3a25" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M240 390 L392 455"/>
    <path d="M534 424 L725 370"/>
    <path d="M786 236 L786 302"/>
    <path d="M180 232 L180 318" stroke-dasharray="8 8"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#2d3a25">
    <rect x="86" y="168" width="202" height="64" rx="14" fill="#e7f0df" stroke="#b9cfaa"/>
    <text x="108" y="195" font-weight="700">1. Measure inside</text>
    <text x="108" y="218">L × W × fill depth</text>
    <rect x="336" y="96" width="240" height="64" rx="14" fill="#e9edf8" stroke="#c5cde7"/>
    <text x="358" y="123" font-weight="700">2. Add assumptions</text>
    <text x="358" y="146">settling, freeboard, mix</text>
    <rect x="628" y="112" width="226" height="86" rx="14" fill="#fff1d7" stroke="#e0bd82"/>
    <text x="650" y="140" font-weight="700">3. Compare outputs</text>
    <text x="650" y="164">bags · bulk · cost</text>
    <text x="650" y="186">copyable shopping list</text>
  </g>
</svg>
